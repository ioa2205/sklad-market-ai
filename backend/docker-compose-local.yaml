x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
  TZ: ${TZ:-Asia/Tashkent}

  SERVER_DOMAIN: ${SERVER_DOMAIN:-https://skladmarket.uz}

  EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery-service:8761/eureka/}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery-service:8761/eureka/}
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"

  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

  KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/market-realm}
  KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://keycloak:8080/realms/market-realm/protocol/openid-connect/token}
  KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080/admin/realms/market-realm}
  KEYCLOAK_MASTER_TOKEN_URL: ${KEYCLOAK_MASTER_TOKEN_URL:-http://keycloak:8080/realms/master/protocol/openid-connect/token}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-market-backend}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-dev-client-secret}
  KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/market-realm}

  AWS_URL: ${MINIO_URL:-http://minio:9000}
  MINIO_URL: ${MINIO_URL:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-skalad-market}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:9000/skalad-market/}

  DB_USERNAME: ${DB_USERNAME:-sklad_user}
  DB_PASSWORD: ${DB_PASSWORD:-sklad-market}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-sklad_user}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-sklad-market}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-5}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-1}

  MAIL_HOST: ${MAIL_HOST:-smtp.mail.ru}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-local@example.invalid}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-local-mail-disabled}
  MAIL_PROTOCOL: ${MAIL_PROTOCOL:-smtp}
  MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
  MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
  MAIL_SMTP_SSL_TRUST: ${MAIL_SMTP_SSL_TRUST:-smtp.mail.ru}
  MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
  MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-true}

networks:
  skladmarket-net:
    driver: bridge

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sklad_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sklad-market}
      POSTGRES_MULTIPLE_DATABASES: "skalad_market_auth,skalad_market_user,skalad_market_company,skalad_market_category,skalad_market_product,skalad_market_lead,skalad_market_chat,skalad_market_notification,skalad_market_report,skalad_market_file"
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - skladmarket-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sklad_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: ${TZ:-Asia/Tashkent}
    networks:
      - skladmarket-net
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      TZ: ${TZ:-Asia/Tashkent}
    networks:
      - skladmarket-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - skladmarket-net
    restart: unless-stopped

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - skladmarket-net
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/skalad-market;
      mc anonymous set public local/skalad-market;
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/market-realm.json:/opt/keycloak/data/import/market-realm.json:ro
    networks:
      - skladmarket-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  keycloak-config:
    image: quay.io/keycloak/keycloak:24.0
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/user-profile.json:/config/user-profile.json:ro
    networks:
      - skladmarket-net
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/keycloak/bin/kcadm.sh config credentials
        --server http://keycloak:8080 --realm master
        --user "$${KEYCLOAK_ADMIN}" --password "$${KEYCLOAK_ADMIN_PASSWORD}"
        --config /tmp/kcadm.config
        && /opt/keycloak/bin/kcadm.sh update users/profile
        -r market-realm -f /config/user-profile.json
        --config /tmp/kcadm.config

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - skladmarket-net
    restart: unless-stopped

  ai-db:
    image: pgvector/pgvector:pg16
    container_name: ai-db
    ports:
      - "5442:5432"
    environment:
      POSTGRES_DB: skalad_market_ai
      POSTGRES_USER: ${AI_DB_USERNAME:-ai_user}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:-ai-market}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    networks:
      - skladmarket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USERNAME:-ai_user} -d skalad_market_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend Services ──────────────────────────────────────────────────────

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - skladmarket-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8761
      TZ: ${TZ:-Asia/Tashkent}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: auth-service
    container_name: auth-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: auth-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_auth

  user-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: user-service
    container_name: user-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: user-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: user-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_user

  company-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: company-service
    container_name: company-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: company-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: company-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_company

  category-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: category-service
    container_name: category-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: category-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8084
      SPRING_APPLICATION_NAME: category-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_category

  product-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: product-service
    container_name: product-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: product-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8085
      SPRING_APPLICATION_NAME: product-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_product
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

  lead-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: lead-service
    container_name: lead-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      product-service:
        condition: service_started
      company-service:
        condition: service_started
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: lead-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8086
      SPRING_APPLICATION_NAME: lead-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_lead
      PRODUCT_SERVICE_URL: http://product-service:8085
      COMPANY_SERVICE_URL: http://company-service:8083

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: chat-service
    container_name: chat-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
      company-service:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: chat-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8087
      SPRING_APPLICATION_NAME: chat-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_chat
      COMPANY_SERVICE_URL: http://company-service:8083
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8085

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: notification-service
    container_name: notification-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: notification-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8088
      SPRING_APPLICATION_NAME: notification-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_notification

  report-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: report-service
    container_name: report-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      product-service:
        condition: service_started
      company-service:
        condition: service_started
      chat-service:
        condition: service_started
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: report-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8089
      SPRING_APPLICATION_NAME: report-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_report

  file-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: file-service
    container_name: file-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: file-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8090
      SPRING_APPLICATION_NAME: file-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/skalad_market_file

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile-service
      args:
        SERVICE_DIR: ai-service
    container_name: ai-service
    networks:
      - skladmarket-net
    restart: unless-stopped
    depends_on:
      ai-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: ai-service
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8091
      SPRING_APPLICATION_NAME: ai-service
      AI_CORS_ALLOWED_ORIGINS: ${AI_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      SPRING_DATASOURCE_URL: jdbc:postgresql://ai-db:5432/skalad_market_ai
      SPRING_DATASOURCE_USERNAME: ${AI_DB_USERNAME:-ai_user}
      SPRING_DATASOURCE_PASSWORD: ${AI_DB_PASSWORD:-ai-market}
      AI_DB_USERNAME: ${AI_DB_USERNAME:-ai_user}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-ai-market}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gemini-3.6-flash}
      AI_CHAT_MODEL_ADVANCED: ${AI_CHAT_MODEL_ADVANCED:-gemini-3.1-pro-preview}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-001}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-768}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-http://api-gateway:8080}
      AI_RATE_LIMIT_RPM: ${AI_RATE_LIMIT_RPM:-10}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-200000}
      AI_MAX_TOOL_ITERATIONS: ${AI_MAX_TOOL_ITERATIONS:-6}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_DRAFT_TTL_MINUTES: ${AI_DRAFT_TTL_MINUTES:-30}

volumes:
  postgres-data:
  keycloak-data:
  minio-data:
  elasticsearch-data:
  ai-db-data:
